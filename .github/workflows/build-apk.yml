name: Build & Verify FoldShot APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK & Run Verification Suite
        run: |
          chmod +x tools/build_apk.sh
          bash tools/build_apk.sh
          python3 tools/verify_foldshot.py

      - name: Upload FoldShot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoldShot-apk
          path: FoldShot.apk
