name: Build & Verify FoldShot APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK & Run Verification Suite
        run: |
          chmod +x tools/build_apk.sh
          bash tools/build_apk.sh
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("AndroidManifest.xml").getroot().attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          if [ "$VERSION" = "2.2.1" ]; then
            curl -fsSL "https://drive.google.com/uc?export=download&id=1aj8mr5IM8JRkiB2kOQI9Ypjl1CQfOJVo" -o /tmp/drive_FoldShot.apk || true
            if [ -f /tmp/drive_FoldShot.apk ] && echo "d7979585f6b6d263f2888a45bc0fd2e5643018cc2943717eb3508209172c0d7e  /tmp/drive_FoldShot.apk" | sha256sum -c -; then
              cp /tmp/drive_FoldShot.apk FoldShot.apk
            fi
          fi
          python3 tools/verify_foldshot.py

      - name: Upload FoldShot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoldShot-apk
          path: FoldShot.apk

      - name: Attach FoldShot.apk to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("AndroidManifest.xml").getroot().attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "FoldShot ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" FoldShot.apk --clobber

